name: Publish qualified PyPI artifact

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release tag and commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git status --porcelain)" = ""
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked verification environment
        run: python -m pip install --require-hashes -r requirements-rsi-ci.lock
      - name: Verify source, TCB, lock, ledger, and release status
        run: |
          python tools/generate_release_manifests.py --check
          python tools/verify_release.py --prebuild --expected-commit "$(git rev-parse HEAD)"
      - name: Record build provenance for exact checkout
        run: python tools/generate_build_provenance.py
      - name: Build exact checkout
        run: python -m build --sdist --wheel
      - name: Verify package contents and record hashes
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$wheel" && test -n "$sdist"
          python tools/verify_package.py --expected-commit "$(git rev-parse HEAD)" --wheel "$wheel" --sdist "$sdist"
          python tools/verify_release.py --expected-commit "$(git rev-parse HEAD)" --wheel "$wheel" --sdist "$sdist"
          sha256sum dist/* > dist/SHA256SUMS
      - name: Attest exact artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish qualified artifacts
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

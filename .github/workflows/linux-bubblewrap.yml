name: Linux Bubblewrap

on:
  pull_request:
    paths:
      - aide/rsi/reference_evaluator.py
      - aide/rsi/canary.py
      - aide/rsi/runner.py
      - aide/rsi/state.py
      - aide/rsi/statistics.py
      - aide/rsi/trusted_evaluator.py
      - aide/utils/config.py
      - aide/utils/config.yaml
      - rsi_anchor_service.py
      - tests/test_rsi_recovery_hardening.py
      - tests/test_rsi_reference_evaluator.py
      - tests/test_rsi_trusted_evaluator.py
      - tests/test_rsi_v120.py
      - tests/test_rsi_anchor_service.py
      - tests/test_rsi_statistics_budget.py
      - tests/test_rsi_multitask_canary.py
      - tests/test_rsi_statistics_qualification_tool.py
      - tools/qualify_canary_statistics.py
      - tools/generate_release_manifests.py
      - .github/workflows/linux-bubblewrap.yml
  push:
    branches: [main, fix/aide-rsi-authority-closure]
    paths:
      - aide/rsi/reference_evaluator.py
      - aide/rsi/canary.py
      - aide/rsi/runner.py
      - aide/rsi/state.py
      - aide/rsi/statistics.py
      - aide/rsi/trusted_evaluator.py
      - aide/utils/config.py
      - aide/utils/config.yaml
      - rsi_anchor_service.py
      - tests/test_rsi_recovery_hardening.py
      - tests/test_rsi_reference_evaluator.py
      - tests/test_rsi_trusted_evaluator.py
      - tests/test_rsi_v120.py
      - tests/test_rsi_anchor_service.py
      - tests/test_rsi_statistics_budget.py
      - tests/test_rsi_multitask_canary.py
      - tests/test_rsi_statistics_qualification_tool.py
      - tools/qualify_canary_statistics.py
      - tools/generate_release_manifests.py
      - .github/workflows/linux-bubblewrap.yml

permissions:
  contents: read

jobs:
  confinement:
    name: Reference evaluator confinement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bubblewrap and focused test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          python -m pip install pytest numpy dataclasses_json humanize black requests backoff
      - name: Require Bubblewrap
        run: command -v bwrap
      - name: Run Linux candidate isolation tests
        # The hosted VM's unprivileged user namespace can create a network
        # namespace but cannot configure its loopback device. Run this isolated
        # test job as root so Bubblewrap can complete namespace setup.
        run: |
          sudo env PYTHONPATH=. "$pythonLocation/bin/python" -m pytest -q \
            tests/test_rsi_reference_evaluator.py \
            tests/test_rsi_trusted_evaluator.py::test_evaluator_identity_binds_resource_limits \
            tests/test_rsi_trusted_evaluator.py::test_requested_process_limit_is_capped_to_host_hard_limit \
            tests/test_rsi_recovery_hardening.py::test_https_anchor_pins_certificate_before_sending_credentials \
            tests/test_rsi_recovery_hardening.py::test_signed_canary_attempt_counter_is_monotonic \
            tests/test_rsi_recovery_hardening.py::test_recovery_rejects_canary_from_another_sequential_attempt \
            tests/test_rsi_recovery_hardening.py::test_long_sequence_of_interrupted_canaries_never_restores_retired_samples \
            tests/test_rsi_v120.py::test_sequential_canary_alpha_spending_is_durable_and_pair_count_scales \
            tests/test_rsi_anchor_service.py \
            tests/test_rsi_statistics_budget.py \
            tests/test_rsi_multitask_canary.py \
            tests/test_rsi_statistics_qualification_tool.py
      - name: Check generated release manifests
        run: python tools/generate_release_manifests.py --check

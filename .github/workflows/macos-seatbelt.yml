name: macOS Seatbelt

on:
  pull_request:
    paths:
      - aide/rsi/sandbox.py
      - tests/test_rsi_seatbelt.py
      - .github/workflows/macos-seatbelt.yml
  push:
    branches: [main]
    paths:
      - aide/rsi/sandbox.py
      - tests/test_rsi_seatbelt.py
      - .github/workflows/macos-seatbelt.yml

jobs:
  confinement:
    name: Native confinement
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install pytest humanize dataclasses-json
      - name: Require native sandbox and disk image tools
        run: test -x /usr/bin/sandbox-exec && test -x /usr/bin/hdiutil
      - name: Run Seatbelt boundary tests
        run: PYTHONPATH=. python -m pytest -q tests/test_rsi_seatbelt.py

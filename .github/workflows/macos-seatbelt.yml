name: macOS Seatbelt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - aide/rsi/reference_evaluator.py
      - aide/rsi/runner.py
      - aide/rsi/trusted_evaluator.py
      - aide/utils/config.py
      - aide/utils/config.yaml
      - aide/rsi/sandbox.py
      - tests/test_rsi_seatbelt.py
      - tests/test_rsi_reference_evaluator.py
      - tests/test_rsi_trusted_evaluator.py
      - requirements-rsi-ci.in
      - requirements-rsi-ci.lock
      - .github/workflows/macos-seatbelt.yml
  push:
    branches: [main, fix/1.3.6-authority-statistics]
    paths:
      - aide/rsi/reference_evaluator.py
      - aide/rsi/runner.py
      - aide/rsi/trusted_evaluator.py
      - aide/utils/config.py
      - aide/utils/config.yaml
      - aide/rsi/sandbox.py
      - tests/test_rsi_seatbelt.py
      - tests/test_rsi_reference_evaluator.py
      - tests/test_rsi_trusted_evaluator.py
      - requirements-rsi-ci.in
      - requirements-rsi-ci.lock
      - .github/workflows/macos-seatbelt.yml

jobs:
  confinement:
    name: Native confinement
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-rsi-ci.lock
      - name: Require native sandbox and disk image tools
        run: test -x /usr/bin/sandbox-exec && test -x /usr/bin/hdiutil
      - name: Run Seatbelt boundary and first-party evaluator tests
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_rsi_seatbelt.py
          tests/test_rsi_reference_evaluator.py
          tests/test_rsi_trusted_evaluator.py::test_first_party_reference_evaluator_is_wired_through_trusted_runner

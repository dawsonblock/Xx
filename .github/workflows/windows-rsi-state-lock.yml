name: Windows RSI state lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - aide/rsi/state.py
      - aide/rsi/statistics.py
      - aide/rsi/canary.py
      - aide/rsi/runner.py
      - rsi_anchor_service.py
      - tests/test_rsi_recovery_hardening.py
      - tests/test_rsi_anchor_service.py
      - tests/test_rsi_statistics_budget.py
      - tests/test_rsi_statistics_qualification_tool.py
      - tools/generate_release_manifests.py
      - .github/workflows/windows-rsi-state-lock.yml
  push:
    branches: [main, fix/aide-rsi-authority-closure]
    paths:
      - aide/rsi/state.py
      - aide/rsi/statistics.py
      - aide/rsi/canary.py
      - aide/rsi/runner.py
      - rsi_anchor_service.py
      - tests/test_rsi_recovery_hardening.py
      - tests/test_rsi_anchor_service.py
      - tests/test_rsi_statistics_budget.py
      - tests/test_rsi_statistics_qualification_tool.py
      - tools/generate_release_manifests.py
      - .github/workflows/windows-rsi-state-lock.yml

permissions:
  contents: read

jobs:
  writer-lock:
    name: Import state and verify exclusive writer lock
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install pytest numpy dataclasses_json humanize backoff black requests
      - name: Test cross-platform state import and locking
        run: >-
          python -m pytest -q
          tests/test_rsi_recovery_hardening.py::test_rsi_writer_lock_is_exclusive_and_released
          tests/test_rsi_recovery_hardening.py::test_https_anchor_pins_certificate_before_sending_credentials
          tests/test_rsi_recovery_hardening.py::test_signed_canary_attempt_counter_is_monotonic
          tests/test_rsi_recovery_hardening.py::test_recovery_rejects_canary_from_another_sequential_attempt
          tests/test_rsi_recovery_hardening.py::test_long_sequence_of_interrupted_canaries_never_restores_retired_samples
          tests/test_rsi_v120.py::test_fixed_horizon_canary_alpha_is_durable_and_pair_count_is_stable
          tests/test_rsi_anchor_service.py
          tests/test_rsi_statistics_budget.py
          tests/test_rsi_statistics_qualification_tool.py

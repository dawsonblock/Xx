name: Windows RSI state lock

on:
  pull_request:
    paths:
      - aide/rsi/state.py
      - tests/test_rsi_recovery_hardening.py
      - .github/workflows/windows-rsi-state-lock.yml
  push:
    branches: [main, fix/aide-rsi-authority-closure]
    paths:
      - aide/rsi/state.py
      - tests/test_rsi_recovery_hardening.py
      - .github/workflows/windows-rsi-state-lock.yml

permissions:
  contents: read

jobs:
  writer-lock:
    name: Import state and verify exclusive writer lock
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install pytest numpy dataclasses_json humanize backoff black requests
      - name: Test cross-platform state import and locking
        run: python -m pytest -q tests/test_rsi_recovery_hardening.py::test_rsi_writer_lock_is_exclusive_and_released
